name: Build Windows executable

on:
  push:
    branches:
      - codex/fix-telegram-bot-support-orders
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --name ChinaStoreBot --collect-all aiogram bot.py

      - name: Include environment template
        run: Copy-Item .env.example dist/.env.example
        shell: pwsh

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ChinaStoreBot-windows
          path: |
            dist/ChinaStoreBot.exe
            dist/.env.example
          if-no-files-found: error
          retention-days: 30
