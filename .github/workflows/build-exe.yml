name: Build Windows executable

on:
  push:
    branches:
      - codex/fix-telegram-bot-support-orders
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --name ChinaStoreBot --collect-all aiogram bot.py

      - name: Include environment template
        run: Copy-Item .env.example dist/.env.example
        shell: pwsh

      - name: Package Windows download
        run: Compress-Archive -Path dist/ChinaStoreBot.exe,dist/.env.example -DestinationPath dist/ChinaStoreBot-windows.zip
        shell: pwsh

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ChinaStoreBot-windows
          path: |
            dist/ChinaStoreBot.exe
            dist/.env.example
          if-no-files-found: error
          retention-days: 30

      - name: Publish or update latest Windows release
        if: github.ref == 'refs/heads/codex/fix-telegram-bot-support-orders'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload windows-latest dist/ChinaStoreBot-windows.zip --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create windows-latest dist/ChinaStoreBot-windows.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "China Store Bot for Windows" --notes "Latest Windows bot build. Run UpdateBot.bat next to the executable to install future builds."
          }
        shell: pwsh

